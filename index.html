<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Osud dobrodruha</title>

<style>

body{
    background:#1a1208;
    color:#f8e8c8;
    font-family:Georgia, serif;
    text-align:center;
    margin:0;
    padding:40px;
}

h1{
    color:#ffb347;
    font-size:60px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    max-width:1600px;
    margin:auto;
}

.card{
    border:none;
    background:none;
}

.card:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px orange;
}

.card img{
    width:100%;
    display:block;
}
.card h2{
    color:#ffb347;
}

.card p{
    padding:0 20px;
}

.button{
    display:inline-block;
    margin:20px;
    padding:12px 25px;
    background:#ffb347;
    color:black;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.button:hover{
    background:#ffd08a;
}

</style>
</head>

<body>

<h1>Osud dobrodruha</h1>

<p>Vyber si jednu cestu. Po vykročení není návratu.</p>

<div class="grid">

<div class="card">
<img src="images/Blízká láska.jpg">

<p>Dokážeš získat srdce osoby, kterou obdivuješ?</p>
<a class="button" href="laska.html">Vybrat</a>
</div>

<div class="card">
<img src="images/Lesní rituál.jpg">

<p>V tajemném lese probíhá prastarý obřad.</p>
<a class="button" href="ritual.html">Vybrat</a>
</div>

<div class="card">
<img src="images/Nebezpečná plavba.jpg">

<p>Bouře a mořská monstra čekají za horizontem.</p>
<a class="button" href="plavba.html">Vybrat</a>
</div>

<div class="card">
<img src="images/Odhalit doupě pirátů.jpg">

<p>Máš odvahu proniknout mezi piráty?</p>
<a class="button" href="pirati.html">Vybrat</a>
</div>

</div>

</body>
</html>
