<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Osud dobrodruha</title>

<style>

body{
    background:#1a1208;
    color:#f8e8c8;
    font-family:Georgia, serif;
    text-align:center;
    margin:0;
    padding:40px;
}

h1{
    color:#ffb347;
    font-size:60px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    max-width:1600px;
    margin:auto;
}

.card{
    border:none;
    background:none;
}

.card:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px orange;
}

.card img{
    width:100%;
    display:block;
}
.card h2{
    color:#ffb347;
}

.card p{
    padding:0 20px;
}


</style>
</head>

<body>

<h1>Osud námořníka</h1>

<p>Vyber si jednu cestu. Po vykročení není návratu.</p>

<div class="grid">

<div class="card">
    <a href="laska.html">
        <img src="images/Blízká láska.jpg" alt="Blízká láska">
    </a>
    <p>Dokážeš získat srdce osoby, kterou obdivuješ?</p>
</div>

<div class="card">
    <a href="ritual.html">
        <img src="images/Lesní rituál.jpg" alt="Lesní rituál">
    </a>
    <p>V tajemném lese probíhá prastarý obřad.</p>
</div>

<div class="card">
    <a href="plavba.html">
        <img src="images/Nebezpečná plavba.jpg" alt="Nebezpečná plavba">
    </a>
    <p>Bouře a mořská monstra čekají za horizontem.</p>
</div>

<div class="card">
    <a href="pirati.html">
        <img src="images/Odhalit doupě pirátů.jpg" alt="Doupě pirátů">
    </a>
    <p>Máš odvahu proniknout mezi piráty?</p>
</div>

</div>
