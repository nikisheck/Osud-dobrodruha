<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<title>Tvá cesta</title>

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:40px;

    background:#0f0804;
    color:#f8e8c8;

    font-family:'MedievalSharp', serif;
    text-align:center;
}

h1{
    color:#ffb347;
    margin-bottom:50px;
}
    .statistiky{

    max-width:700px;
    margin:30px auto;

    background:rgba(255,255,255,0.08);

    padding:25px;

    border-radius:15px;

}

.stat{

    margin:12px;
    font-size:24px;

}

.archetyp{

    margin:40px auto;

    max-width:800px;

    background:rgba(255,179,71,0.12);

    border:1px solid #ffb347;

    padding:30px;

    border-radius:15px;

}

.archetyp h2{

    color:#ffb347;

}

.karty{

    display:flex;

    justify-content:center;

    margin-top:80px;

}

.karta{

    width:260px;

    margin-left:-80px;

    transition:all 0.4s ease;

    cursor:pointer;

    position:relative;

}

.karta:first-child{
    margin-left:0;
}

.karta img{

    width:100%;

    border-radius:12px;

    box-shadow:0 0 15px rgba(0,0,0,0.5);

}

.karta:hover{

    transform:translateY(-20px) scale(1.08);

    z-index:100;

}

.karta:hover img{

    box-shadow:
    0 0 15px #ff7f1d,
    0 0 40px rgba(255,127,29,0.6);

}

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.9);

    z-index:1000;

    justify-content:center;

    align-items:center;

}

.modal img{

    max-height:90vh;

    max-width:90vw;

}

.close{

    position:absolute;

    top:20px;

    right:40px;

    font-size:50px;

    color:white;

    cursor:pointer;

}

</style>
</head>

<body>

<h1>Tvá cesta osudem</h1>

    <div class="statistiky">

    <h2>Charakteristika postavy</h2>

    <div class="stat" id="vztahy"></div>
    <div class="stat" id="odvaha"></div>
    <div class="stat" id="bohatstvi"></div>
    <div class="stat" id="osud"></div>
    <div class="stat" id="moc"></div>
    <div class="stat" id="vedomosti"></div>

</div>

<div class="archetyp">

    <h2 id="nazevArchetypu"></h2>

    <p id="popisArchetypu"></p>

</div>

<div class="karty" id="kartyContainer">

</div>

<div class="modal" id="modal">

    <span class="close" onclick="zavri()">&times;</span>

    <img id="velkyObrazek">

</div>

<script>

const vybraneKarty = JSON.parse(
    localStorage.getItem("cesta")
) || [];

const container = document.getElementById("kartyContainer");

vybraneKarty.forEach(karta => {

    container.innerHTML += `
        <div class="karta">

            <img
                src="${karta.obrazek}"
                onclick="zobraz('${karta.obrazek}')"
            >

        </div>
    `;

});
let vztahy = 0;
let odvaha = 0;
let bohatstvi = 0;
let osud = 0;
let moc = 0;
let vedomosti = 0;

vybraneKarty.forEach(karta => {

    if(!karta.bonusy) return;

    vztahy += karta.bonusy.vztahy || 0;
    odvaha += karta.bonusy.odvaha || 0;
    bohatstvi += karta.bonusy.bohatstvi || 0;
    osud += karta.bonusy.osud || 0;
    moc += karta.bonusy.moc || 0;
    vedomosti += karta.bonusy.vedomosti || 0;

});
document.getElementById("vztahy").innerHTML =
"❤️ Vztahy: " + vztahy;

document.getElementById("odvaha").innerHTML =
"⚔️ Odvaha: " + odvaha;

document.getElementById("bohatstvi").innerHTML =
"💰 Bohatství: " + bohatstvi;

document.getElementById("osud").innerHTML =
"✨ Osud: " + osud;

document.getElementById("moc").innerHTML =
"👑 Moc: " + moc;

document.getElementById("vedomosti").innerHTML =
"📚 Vědomosti: " + vedomosti;
    const archetypy = {

    vztahy:{
        nazev:"Strážce srdcí",
        popis:"Vztahy a věrnost byly největší silou tvého života."
    },

    odvaha:{
        nazev:"Dobyvatel horizontů",
        popis:"Riskoval jsi více než ostatní a právě díky tomu ses stal legendou."
    },

    bohatstvi:{
        nazev:"Pán obchodu",
        popis:"Viděl jsi příležitost tam, kde ostatní viděli překážky."
    },

    osud:{
        nazev:"Dítě osudu",
        popis:"Tvůj život byl veden magií, tajemstvími a prastarými silami."
    },

    moc:{
        nazev:"Vládce osudu",
        popis:"Toužil jsi po vlivu a dokázal jsi změnit svět kolem sebe."
    },

    vedomosti:{
        nazev:"Mistr vědění",
        popis:"Největší zbraní pro tebe nebyl meč, ale poznání."
    }

};
const vysledky = {

    vztahy,
    odvaha,
    bohatstvi,
    osud,
    moc,
    vedomosti

};

const nejvyssi = Object.keys(vysledky)
.reduce((a,b) =>
vysledky[a] > vysledky[b] ? a : b);

document.getElementById("nazevArchetypu").innerHTML =
archetypy[nejvyssi].nazev;

document.getElementById("popisArchetypu").innerHTML =
archetypy[nejvyssi].popis;
function zobraz(cesta){

    document.getElementById("modal").style.display="flex";

    document.getElementById("velkyObrazek").src=cesta;

}

function zavri(){

    document.getElementById("modal").style.display="none";

}

</script>

</body>
</html>
