<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">

<title>Tvá cesta osudem</title>

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:40px;

    background:#0f0804;
    color:#f8e8c8;

    font-family:'MedievalSharp', serif;
    text-align:center;
}

h1{
    color:#ffb347;
}

.statistiky{

    max-width:700px;

    margin:auto;

    margin-top:30px;

    margin-bottom:50px;

    background:rgba(255,255,255,0.08);

    padding:25px;

    border-radius:15px;

}

.stat{

    font-size:22px;

    margin:10px;

}

.archetyp{

    max-width:800px;

    margin:40px auto;

    padding:30px;

    border-radius:15px;

    border:1px solid #ffb347;

    background:rgba(255,179,71,0.08);

}

.archetyp h2{

    color:#ffb347;

    margin-top:0;

}

.karty{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    margin-top:60px;

}

.karta{

    width:250px;

    margin-left:-70px;

    transition:all .4s ease;

    position:relative;

    cursor:pointer;

}

.karta:first-child{

    margin-left:0;

}

.karta:hover{

    transform:translateY(-20px) scale(1.08);

    z-index:100;

}

.karta img{

    width:100%;

    border-radius:12px;

    box-shadow:
        0 0 15px rgba(0,0,0,0.5);

}

.karta:hover img{

    box-shadow:
        0 0 15px #ff7f1d,
        0 0 40px rgba(255,127,29,0.6);

}

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.92);

    justify-content:center;

    align-items:center;

    z-index:1000;

}

.modal img{

    max-width:90vw;

    max-height:90vh;

}

.close{

    position:absolute;

    top:20px;

    right:40px;

    color:white;

    font-size:50px;

    cursor:pointer;

}

</style>
</head>

<body>

<h1>Tvá cesta osudem</h1>

<div class="statistiky">

    <h2>Výsledné statistiky</h2>

    <div class="stat" id="vztahy"></div>
    <div class="stat" id="odvaha"></div>
    <div class="stat" id="bohatstvi"></div>
    <div class="stat" id="osud"></div>
    <div class="stat" id="moc"></div>
    <div class="stat" id="vedomosti"></div>

</div>

<div class="archetyp">

    <h2 id="archetypNazev"></h2>

    <p id="archetypPopis"></p>

</div>

<h2>Tvé vybrané karty</h2>

<div class="karty" id="kartyContainer"></div>

<div class="modal" id="modal">

    <span class="close" onclick="zavri()">&times;</span>

    <img id="velkyObrazek">

</div>

<script>

const vybraneKarty =
JSON.parse(localStorage.getItem("cesta")) || [];

let vztahy = 0;
let odvaha = 0;
let bohatstvi = 0;
let osud = 0;
let moc = 0;
let vedomosti = 0;

const container =
document.getElementById("kartyContainer");

vybraneKarty.forEach(karta => {

    container.innerHTML += `
        <div class="karta">

            <img
            src="${karta.obrazek}"
            onclick="zobraz('${karta.obrazek}')">

        </div>
    `;

    if(karta.bonusy){

        vztahy += karta.bonusy.vztahy || 0;

        odvaha += karta.bonusy.odvaha || 0;

        bohatstvi += karta.bonusy.bohatstvi || 0;

        osud += karta.bonusy.osud || 0;

        moc += karta.bonusy.moc || 0;

        vedomosti += karta.bonusy.vedomosti || 0;

    }

});

document.getElementById("vztahy").innerHTML =
"❤️ Vztahy: " + vztahy;

document.getElementById("odvaha").innerHTML =
"⚔️ Odvaha: " + odvaha;

document.getElementById("bohatstvi").innerHTML =
"💰 Bohatství: " + bohatstvi;

document.getElementById("osud").innerHTML =
"✨ Osud: " + osud;

document.getElementById("moc").innerHTML =
"👑 Moc: " + moc;

document.getElementById("vedomosti").innerHTML =
"📚 Vědomosti: " + vedomosti;

const archetypy = {

    vztahy:{
        nazev:"❤️ Strážce srdcí",
        popis:"Vztahy, přátelství a věrnost byly během tvého života nejdůležitější hodnotou."
    },

    odvaha:{
        nazev:"⚔️ Dobyvatel horizontů",
        popis:"Nebezpečí tě nikdy nezastavilo. Tvůj život byl plný dobrodružství a risku."
    },

    bohatstvi:{
        nazev:"💰 Pán obchodu",
        popis:"Uměl jsi proměnit příležitosti v bohatství a získat výhodu tam, kde ji ostatní neviděli."
    },

    osud:{
        nazev:"✨ Dítě osudu",
        popis:"Tvou cestu ovlivňovaly tajemné síly, magie a pradávná proroctví."
    },

    moc:{
        nazev:"👑 Vládce osudu",
        popis:"Toužil jsi po vlivu a schopnosti měnit svět kolem sebe."
    },

    vedomosti:{
        nazev:"📚 Mistr vědění",
        popis:"Největší zbraní pro tebe nebyl meč, ale poznání."
    }

};

const vysledky = {

    vztahy,
    odvaha,
    bohatstvi,
    osud,
    moc,
    vedomosti

};

const nejvyssi =
Object.keys(vysledky)
.reduce((a,b) =>
vysledky[a] > vysledky[b]
? a
: b
);

document.getElementById("archetypNazev").innerHTML =
archetypy[nejvyssi].nazev;

document.getElementById("archetypPopis").innerHTML =
archetypy[nejvyssi].popis;

function zobraz(cesta){

    document.getElementById("modal").style.display =
    "flex";

    document.getElementById("velkyObrazek").src =
    cesta;

}

function zavri(){

    document.getElementById("modal").style.display =
    "none";

}

</script>

</body>
</html>
