<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Blízká láska</title>

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    
<style>

body{
    position:relative;

    background-image:url('images/laskapozadi.JPG');
    background-size:cover;
    background-position:center center;
    background-attachment:fixed;
    background-repeat:no-repeat;

    color:#dfe9f7;
    text-align:center;
    font-family:'MedievalSharp', serif;
    padding:40px;
}
    h1{
    color:#299bbe;
    font-size:60px;
}
body::before{

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.15);

    transition:all 1.5s ease;

    pointer-events:none;

    z-index:-1;

}
    body.darkChapter::before{

    background:rgba(0,0,0,0.65);

}

    #kapitola1,
#kapitola2{
    transition:opacity 1s ease;
}

#kapitola2{
    opacity:0;
}
button{
    background:#d97706;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:20px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#f59e0b;
    transform:scale(1.03);
    box-shadow:
0 0 6px #ff6b35,
0 0 15px #ff3d00;
}
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    max-width:1600px;
    margin:auto;
}
.card{
    border:none;
    background:none;
}

.card:hover{
    transform:scale(1.03);
    box-shadow:
0 0 6px #ff6b35,
0 0 15px #ff3d00;
}

.card img{
    width:100%;
    display:block;
}
.card h2{
    color:#ffb347;
}

.card p{
    padding:0 20px;
}
.card{
    cursor:pointer;
    transition:all 1s ease;
}

.card.selected{
    animation: magicChoice 3s forwards;
}

@keyframes magicChoice{

    0%{
        transform:scale(1);
        opacity:1;
    }

    20%{
        transform:scale(1.05);
        opacity:1;

        box-shadow:
            0 0 15px #ff6b35,
            0 0 35px #ff3d00;
    }

    70%{
        transform:scale(1.05);
        opacity:1;

        box-shadow:
            0 0 25px #ff6b35,
            0 0 60px #ff3d00;
    }

    100%{
        transform:scale(1.15);
        opacity:0;
    }
}

.card.burn{
    opacity:0;
    transform:scale(0.7);
    filter:
        brightness(2)
        sepia(1)
        hue-rotate(-30deg);
}

body.animating .grid{
    pointer-events:none;
}
    
</style>
</head>

<script>

function pokracuj(){

    const k1 = document.getElementById("kapitola1");
    const k2 = document.getElementById("kapitola2");

    k1.style.opacity = "0";

    document.body.classList.add("darkChapter");

    setTimeout(() => {

        k1.style.display = "none";

        k2.style.display = "block";

        k2.style.opacity = "0";

        setTimeout(() => {

            k2.style.opacity = "1";

        },50);

    },1000);

}
    
function choose(selectedCard, destination){

    fadeMusic();

    document.body.classList.add("animating");

    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {

        if(card === selectedCard){
            card.classList.add("selected");
        }
        else{
            card.classList.add("burn");
        }

    });

    setTimeout(() => {
        window.location.href = destination;
    },3000);

}
</script>

<body>

    <audio autoplay loop id="bgmusic">
    <source src="music/laska.mp3" type="audio/mpeg">
</audio>
 
<div id="kapitola1">

<h1>Blízká láska</h1>

<p>
Vyměnil jsem studený mořský vítr za vůni jasmínu a hřejivou náruč, která na mě čekala v malém domku na okraji přístavu.
</p>
<p>
Získáváš následující bonusy: +1 ⛲ , +2 ⛪
</p>

<button onclick="pokracuj()">
Pokračuj v dobrodružství
</button>

</div>

<div id="kapitola2" style="display:none;">

<h1>Dobrodružství pokračuje</h1>

<p>
Po několika klidných dnech se objevila nová výzva...
</p>

<div class="grid">

<div class="card" onclick="choose(this,'kamarad.html')">
        <img src="images/Kamarád z dětství.jpg">
    <p>***</p>
</div>

<div class="card" onclick="choose(this,'mesto.html')">
        <img src="images/Strážit město.jpg">
    <p>***</p>
</div>

<div class="card" onclick="choose(this,'ztrata.html')">
        <img src="images/Tragická ztráta.jpg">
    <p>***</p>
</div>

<div class="card" onclick="choose(this,'prokleti.html')">
        <img src="images/Prokletí.jpg">
    <p>***</p>
</div>
</body>
